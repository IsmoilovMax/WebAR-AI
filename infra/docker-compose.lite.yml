# Yengil dev: faqat video + AI uchun minimum.
# AI worker ni Docker emas, mahalliy Python da ishga tushiring (C: ni tejaydi).
#
#   npm run infra:lite
#   cd services/ai-worker && pip install -r requirements.txt
#   set GO2RTC_URL=http://localhost:1984
#   uvicorn app.main:app --host 0.0.0.0 --port 8000
#
# MinIO va event-service yo'q — snapshot/klip va Telegram alertlar ishlamaydi.

name: acs

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: ${POSTGRES_DB:-acs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acs} -d ${POSTGRES_DB:-acs}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  go2rtc:
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml

volumes:
  postgres-data:
  redis-data:
